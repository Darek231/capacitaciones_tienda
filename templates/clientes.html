{% extends 'base.html' %}

{% block content %}
<a href="{{ url_for('agregar_cliente') }}" class="btn btn-success mb-3">Agregar Cliente</a>
<table class="table table-striped table-hover">
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Email</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    {% for cliente in clientes %}
    <tr>
      <td>{{ cliente.id }}</td>
      <td>{{ cliente.nombre }}</td>
      <td>{{ cliente.email }}</td>
      <td>
        <a href="{{ url_for('editar_cliente', id=cliente.id) }}" class="btn btn-primary btn-sm">Editar</a>
        <a href="{{ url_for('eliminar_cliente', id=cliente.id) }}" class="btn btn-danger btn-sm">Eliminar</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
