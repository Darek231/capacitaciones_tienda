{% extends 'base.html' %}

{% block content %}
<h1>compras</h1>
<table class="table table-striped table-hover">
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Fecha</th>
      <th>Cliente</th>
      <th>Categoría</th>
    </tr>
  </thead>
  <tbody>
    {% for compra in compras %}
    <tr>
      <td>{{ compra.id }}</td>
      <td>{{ compra.fecha }}</td>
      <td>{{ compra.cliente }}</td>
      <td>{{ compra.categoria }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
