{% extends 'base.html' %}

{% block content %}

<div class="card">

    <div class="card-header">

        {% if cliente %}
            <h2>Editar Cliente</h2>
        {% else %}
            <h2>Agregar Cliente</h2>
        {% endif %}

    </div>

    <div class="card-body">

        <form method="POST"
              action="{% if cliente %}{{ url_for('editar_cliente', id=cliente.id) }}{% else %}{{ url_for('agregar_cliente') }}{% endif %}">

            <div class="mb-3">

                <label for="nombre" class="form-label">
                    Nombre
                </label>

                <input type="text"
                       class="form-control"
                       id="nombre"
                       name="nombre"
                       value="{{ cliente.nombre if cliente else '' }}"
                       required>

            </div>

            <div class="mb-3">

                <label for="email" class="form-label">
                    Email
                </label>

                <input type="email"
                       class="form-control"
                       id="email"
                       name="email"
                       value="{{ cliente.email if cliente else '' }}"
                       required>

            </div>

            <button type="submit" class="btn btn-primary">

                {% if cliente %}
                    Guardar cambios
                {% else %}
                    Agregar
                {% endif %}

            </button>

            <a href="{{ url_for('clientes') }}"
               class="btn btn-secondary">
                Cancelar
            </a>

        </form>

    </div>

</div>

{% endblock %}
