{% extends 'base.html' %}

{% block content %}
<h1>Categorías</h1>
<a href="{{ url_for('agregar_categoria') }}" class="btn btn-success mb-3">Agregar Categoría</a>
<table class="table table-striped table-hover">
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Acciones</th>

    </tr>
  </thead>
  <tbody>
    {% for categoria in categorias %}
    <tr>
      <td>{{ categoria.id }}</td>
      <td>{{ categoria.nombre }}</td>

      <td>
        <a href="{{ url_for('editar_categoria', id=categoria.id) }}" class="btn btn-primary btn-sm">Editar</a>
        <a href="{{ url_for('eliminar_categoria', id=categoria.id) }}" class="btn btn-danger btn-sm">Eliminar</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
